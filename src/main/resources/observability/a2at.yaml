version: 1.0.0
signal: a2at

attributes:
  operation.name: {otel_name: gen_ai.agent.a2a.operation.name, type: string, signals: SM}
  task_id: {otel_name: gen_ai.agent.a2a.task_id, type: string, signals: S}
  context_id: {otel_name: gen_ai.agent.a2a.context_id, type: string, signals: S}
  message_id: {otel_name: gen_ai.agent.a2a.message_id, type: string, signals: S}
  Role: {otel_name: gen_ai.agent.a2a.Role, type: string, signals: S}
  Extensions: {otel_name: gen_ai.agent.a2a.Extensions, type: string, signals: S}
  parts.number: {otel_name: gen_ai.agent.a2a.parts.number, type: integer, signals: S}
  config_id: {otel_name: gen_ai.agent.a2a.config_id, type: string, signals: S}
  Request: {otel_name: gen_ai.agent.a2a.Request, type: string, signals: S}
  Response: {otel_name: gen_ai.agent.a2a.Response, type: string, signals: S}
  streaming-event: {otel_name: gen_ai.agent.a2a.streaming-event, type: string, signals: S}
  error.type: {otel_name: error.type, type: string, signals: SM}
  gen_ai.system: {otel_name: gen_ai.system, type: string, signals: M}
  extension.name: {otel_name: gen_ai.agent.a2at.extension.name, type: string, values: [task-t, negotiation-t, notification-t, authorization-t]}
  task.type: {otel_name: gen_ai.agent.a2at.task.type, type: string}
  task.object: {otel_name: gen_ai.agent.a2at.task.object, type: string}
  negotiation.id: {otel_name: gen_ai.agent.a2at.negotiation.id, type: string}
  negotiation.round: {otel_name: gen_ai.agent.a2at.negotiation.round, type: integer}
  negotiation.total_rounds: {otel_name: gen_ai.agent.a2at.negotiation.total_rounds, type: integer}
  negotiation.max_rounds: {otel_name: gen_ai.agent.a2at.negotiation.max_rounds, type: integer}
  negotiation.result: {otel_name: gen_ai.agent.a2at.negotiation.result, type: string}
  negotiation.performative: {otel_name: gen_ai.agent.a2at.negotiation.performative, type: string}
  notification.topic: {otel_name: gen_ai.agent.a2at.notification.topic, type: string}
  push.notification.url: {otel_name: gen_ai.agent.a2at.push.notification.url, type: string}
  authorization.stage: {otel_name: gen_ai.agent.a2at.authorization.stage, type: string}
  authorization.policy.operation.type: {otel_name: gen_ai.agent.a2at.authorization.policy.operation.type, type: string}

traces:
  a2a:
    attribute_prefix: gen_ai.agent.a2a.
    signals:
      message/send:
        role: message
        attributes: &a2a_span_attributes
          allowed: [operation.name, task_id, context_id, message_id, Role, Extensions, parts.number, config_id, Request, Response, error.type]
          required: []
      message/stream:
        role: stream
        attributes: *a2a_span_attributes
      message/stream-event:
        role: stream_event
        client_only: true
        attributes:
          allowed: [operation.name, task_id, context_id, message_id, Role, Extensions, parts.number, config_id, Request, Response, error.type, streaming-event]
          required: []
      message/stream-error:
        role: stream_error
        client_only: true
        attributes: *a2a_span_attributes
      tasks/get: {attributes: *a2a_span_attributes}
      tasks/cancel: {attributes: *a2a_span_attributes}
      tasks/list: {attributes: *a2a_span_attributes}
      tasks/resubscribe: {attributes: *a2a_span_attributes}
      tasks/pushNotificationConfig/set: {attributes: *a2a_span_attributes}
      tasks/pushNotificationConfig/get: {attributes: *a2a_span_attributes}
      tasks/pushNotificationConfig/list: {attributes: *a2a_span_attributes}
      tasks/pushNotificationConfig/delete: {attributes: *a2a_span_attributes}
  a2at:
    signals:
      message/send:
        extensions: &a2at_span_extensions
          task-t:
            attributes:
              allowed: [extension.name, task.type, task.object]
              required: [extension.name, task.type]
          negotiation-t:
            attributes:
              allowed: [extension.name, negotiation.id, negotiation.round, negotiation.total_rounds, negotiation.result, negotiation.performative]
              required: [extension.name]
          notification-t:
            attributes:
              allowed: [extension.name, notification.topic, push.notification.url]
              required: [extension.name]
          authorization-t:
            attributes:
              allowed: [extension.name, authorization.stage, authorization.policy.operation.type]
              required: [extension.name]
      message/stream:
        extensions: *a2at_span_extensions

metrics:
  a2a:
    signals:
      gen_ai.client.operation.duration:
        otel_name: gen_ai.client.operation.duration
        type: histogram
        value_type: number
        unit: s
        attributes:
          allowed: [operation.name, gen_ai.system, error.type]
          required: [operation.name]
      gen_ai.agent.a2a.streaming.duration:
        otel_name: gen_ai.agent.a2a.streaming.duration
        type: histogram
        value_type: number
        unit: s
        attributes:
          allowed: [operation.name, gen_ai.system, error.type]
          required: [operation.name]
  a2at:
    signals:
      task.duration:
        otel_name: gen_ai.agent.a2at.task.duration
        type: histogram
        value_type: number
        unit: ms
        attributes:
          allowed: [task.type, task.object]
          required: [task.type]
      task.count:
        otel_name: gen_ai.agent.a2at.task.count
        type: counter
        value_type: integer
        unit: ''
        attributes:
          allowed: [task.type, task.object]
          required: [task.type]
      negotiation.rounds:
        otel_name: gen_ai.agent.a2at.negotiation.rounds
        type: histogram
        value_type: integer
        unit: '{round}'
        attributes:
          allowed: [negotiation.id, negotiation.result]
          required: []
      negotiation.count:
        otel_name: gen_ai.agent.a2at.negotiation.count
        type: counter
        value_type: integer
        unit: ''
        attributes:
          allowed: [negotiation.result]
          required: []
      notification.count:
        otel_name: gen_ai.agent.a2at.notification.count
        type: counter
        value_type: integer
        unit: ''
        attributes:
          allowed: [notification.topic]
          required: []
      authorization.preauthorize.count:
        otel_name: gen_ai.agent.a2at.authorization.preauthorize.count
        type: counter
        value_type: integer
        unit: ''
        attributes:
          allowed: [authorization.policy.operation.type]
          required: []
      authorization.preauthorize.duration:
        otel_name: gen_ai.agent.a2at.authorization.preauthorize.duration
        type: histogram
        value_type: number
        unit: ms
        attributes:
          allowed: [authorization.policy.operation.type]
          required: []
      authorization.execute.count:
        otel_name: gen_ai.agent.a2at.authorization.execute.count
        type: counter
        value_type: integer
        unit: ''
        attributes:
          allowed: [authorization.policy.operation.type]
          required: []
  genai:
    signals:
      gen_ai.client.token.usage:
        otel_name: gen_ai.client.token.usage
        type: counter
        value_type: integer
        unit: token
        attributes:
          allowed: [gen_ai.agent.name, gen_ai.request.model, gen_ai.token.type]
          required: [gen_ai.agent.name, gen_ai.request.model, gen_ai.token.type]

logs:
  a2at:
    signals:
      gen_ai.agent.a2at.message:
        extensions:
          task-t:
            attributes:
              allowed: [extension.name, task.type, task.object]
              required: [extension.name, task.type]
          negotiation-t:
            attributes:
              allowed: [extension.name, negotiation.id, negotiation.round, negotiation.total_rounds, negotiation.max_rounds, negotiation.result, negotiation.performative]
              required: [extension.name]
          notification-t:
            attributes:
              allowed: [extension.name, notification.topic, push.notification.url]
              required: [extension.name]
          authorization-t:
            attributes:
              allowed: [extension.name, authorization.stage, authorization.policy.operation.type]
              required: [extension.name]
