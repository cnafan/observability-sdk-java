version: 1.0.0
signal: agent

attributes:
  gen_ai.agent.name: {otel_name: gen_ai.agent.name, type: string}
  agent.role: {otel_name: gen_ai.agent.a2at.agent.role, type: string}
  agent.skills: {otel_name: gen_ai.agent.a2at.agent.skills, type: string_array}
  agent.state: {otel_name: gen_ai.agent.a2at.agent.state, type: string}
  substep.name: {otel_name: gen_ai.agent.a2at.substep.name, type: string}
  substep.status: {otel_name: gen_ai.agent.a2at.substep.status, type: string}
  gen_ai.request.model: {otel_name: gen_ai.request.model, type: string}
  gen_ai.response.model: {otel_name: gen_ai.response.model, type: string}
  gen_ai.token.type: {otel_name: gen_ai.token.type, type: string}
  workflow.step: {otel_name: gen_ai.agent.a2at.workflow.step, type: string}
  workflow.step.index: {otel_name: gen_ai.agent.a2at.workflow.step.index, type: integer}
metrics:
  substep.duration:
    otel_name: gen_ai.agent.a2at.substep.duration
    type: histogram
    value_type: number
    unit: ms
    attributes:
      allowed: [gen_ai.agent.name, substep.name]
      required: [gen_ai.agent.name, substep.name]

traces:
  substep:
    name_prefix: a2at.substep.
    attributes:
      allowed: [gen_ai.agent.name, substep.name, substep.status]
      required: [gen_ai.agent.name, substep.name, substep.status]

logs:
  agent:
    name: gen_ai.agent.a2at.agent
    attributes:
      allowed: [gen_ai.agent.name, agent.role, agent.skills, agent.state]
      required: [gen_ai.agent.name, agent.state]
  substep:
    name: gen_ai.agent.a2at.substep
    attributes:
      allowed: [gen_ai.agent.name, substep.name, substep.status, workflow.step, workflow.step.index]
      required: [gen_ai.agent.name, substep.name, substep.status]

extensions: {}
